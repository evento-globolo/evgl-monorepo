name: Composition CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  composition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: docker compose config --quiet
      - run: ./scripts/check-pins.sh
